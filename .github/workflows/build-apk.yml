name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Restore signing key (optional secret KEYSTORE_BASE64)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then mkdir -p android/keystore && echo "$KS" | base64 -d > android/keystore/overhead.jks; fi
      - name: Build release APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OverheadCricket-apk
          path: android/app/build/outputs/apk/release/*.apk
